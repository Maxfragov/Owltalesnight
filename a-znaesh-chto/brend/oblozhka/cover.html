<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:C;src:url(../../01-vydry/animatsiya/fonts/c700.woff2) format('woff2');font-weight:700;unicode-range:U+0400-045F,U+2116;}
@font-face{font-family:C;src:url(../../01-vydry/animatsiya/fonts/l700.woff2) format('woff2');font-weight:700;}
html,body{margin:0;background:#000}canvas{display:block}iframe{position:absolute;left:-5000px;width:1080px;height:1920px;border:0}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Шаблон обложки выпуска. draw(cfg) рисует обложку 1080x1920.
// cfg: {num, title:[строки], scene:'путь к scene.html выпуска', art:{name, t, lt, zoom, x, y}, accent}
const W=1080,H=1920,cv=document.getElementById('c'),ctx=cv.getContext('2d');
function loadScene(src){return new Promise(r=>{const f=document.createElement('iframe');f.src=src;f.onload=async()=>{await f.contentWindow.ready;r(f.contentWindow);};document.body.appendChild(f);});}
function glowText(c,txt,x,y,size,col,blur){c.font=`700 ${size}px C`;c.fillStyle=col;c.shadowColor='rgba(255,210,120,0.75)';c.shadowBlur=blur;c.fillText(txt,x,y);c.shadowBlur=0;}
function sparkle(c,x,y,L,a){const k=L*0.18;c.globalAlpha=a;c.fillStyle='#fff6dc';c.beginPath();c.moveTo(x,y-L);c.quadraticCurveTo(x+k,y-k,x+L,y);c.quadraticCurveTo(x+k,y+k,x,y+L);c.quadraticCurveTo(x-k,y+k,x-L,y);c.quadraticCurveTo(x-k,y-k,x,y-L);c.fill();c.globalAlpha=1;}
window.draw=async function(cfg){
  const S=await loadScene(cfg.scene);await document.fonts.load('700 50px C','Ая');
  const a=cfg.art;
  // 1) иллюстрация: сцена из ролика выпуска, без субтитров
  const sc=S.eval('SC');const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const tc=tmp.getContext('2d');
  if(cfg.cfg)Object.assign(S.CFG,cfg.cfg);
  tc.save();sc[a.name](tc,a.t,a.lt);tc.restore();
  const z=a.zoom||1;{const p=tc.getImageData(W/2,4,1,1).data;ctx.fillStyle=`rgb(${p[0]},${p[1]},${p[2]})`;}ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2+(a.x||0),-H/2+(a.y||0));ctx.drawImage(tmp,0,0);ctx.restore();
  // доп. персонажи поверх кадра: cfg.extra=[[имя_функции_из_scene, ...аргументы после ctx]]
  for(const [fn,...args] of (cfg.extra||[]))S[fn](ctx,...args);
  // 2) затемнение сверху и снизу под текст
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(7,11,36,0.97)');g.addColorStop(0.2,'rgba(7,11,36,0.9)');g.addColorStop(0.42,'rgba(7,11,36,0.0)');
  g.addColorStop(0.72,'rgba(7,11,36,0.0)');g.addColorStop(0.86,'rgba(7,11,36,0.85)');g.addColorStop(1,'rgba(7,11,36,0.97)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // 3) шапка серии: совёнок на луне + название (видна в 3:4 и в ролике, вне квадрата сетки)
  const hy=325;
  ctx.save();ctx.translate(255,hy);ctx.scale(0.27,0.27);S.moon(ctx,0,0,0);S.owl(ctx,0,-10,1.75,0,0,false,{});ctx.restore();
  ctx.textAlign='left';glowText(ctx,'А знаешь что...',345,hy+12,66,'#ffe9b0',24);
  ctx.font='700 30px C';ctx.fillStyle='#cfd6ff';ctx.fillText(cfg.sub||'истории перед сном',350,hy+58);
  // 4) заголовок выпуска (внутри квадрата 1:1, y 420-1500)
  ctx.textAlign='center';const ts=cfg.titleSize||84;
  {const ty=500+ts*0.6+(cfg.title.length-1)*ts*0.59+ts*0.1;const rg=ctx.createRadialGradient(W/2,ty,40,W/2,ty,560);rg.addColorStop(0,'rgba(7,11,36,0.7)');rg.addColorStop(1,'rgba(7,11,36,0)');
   ctx.save();ctx.translate(W/2,ty);ctx.scale(1,0.42);ctx.translate(-W/2,-ty);ctx.fillStyle=rg;ctx.fillRect(0,ty-560,W,1120);ctx.restore();}
  cfg.title.forEach((l,i)=>glowText(ctx,l,W/2,500+ts+i*ts*1.18,ts,'#fff3d2',34));
  // 5) номер выпуска
  const ny=1435,txt=`выпуск ${cfg.num}`;ctx.font='700 40px C';const tw=ctx.measureText(txt).width+70;
  ctx.fillStyle='rgba(255,233,176,0.95)';ctx.beginPath();ctx.roundRect(W/2-tw/2,ny-38,tw,76,38);ctx.fill();
  ctx.fillStyle='#141c4a';ctx.fillText(txt,W/2,ny+14);
  // 6) низ: звёздочки и подпись
  [[150,1560,14,.8],[935,1540,18,.9],[840,1650,10,.6],[230,1660,11,.6]].forEach(([x,y,l,o])=>sparkle(ctx,x,y,l,o));
  ctx.font='700 34px C';ctx.fillStyle='rgba(207,214,255,0.85)';ctx.fillText(cfg.bottom||'',W/2,1625);
  if(cfg.guides){ctx.strokeStyle='rgba(255,0,0,.7)';ctx.lineWidth=4;ctx.strokeRect(2,420,W-4,1080);ctx.strokeStyle='rgba(0,255,0,.7)';ctx.strokeRect(2,240,W-4,1440);}
  return true;
};
</script></body></html>
